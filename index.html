<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROS 2 Academy — learn robots by typing</title>
<meta name="description" content="Learn ROS 2 from absolute zero to pro in your browser: a real simulated terminal, a live node graph, and a turtle robot that moves when your code tells it to.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <button class="hbtn" id="btn-sidebar" title="Show lessons">☰</button>
  <div class="logo">
    <span class="bot">🤖</span>
    <span><b>ROS 2</b> Academy<br><small>zero → robot programmer <em id="app-version"></em></small></span>
  </div>

  <div class="hspace"></div>

  <div class="progress-wrap">
    <div class="pbar"><i id="progress-fill"></i></div>
    <span id="progress-text">0 / 0 lessons</span>
  </div>
  <div class="xp">⚡ <span id="xp-count">0</span></div>
  <div id="badges"></div>

  <div id="mode-toggle" title="Same lesson, two ways of explaining it">
    <button data-mode="kid" class="on">🧒 Simple</button>
    <button data-mode="pro">🎓 Pro</button>
  </div>

  <button class="hbtn" id="btn-restart-world" title="Stop every running node (your files are kept)">⏹ Stop all</button>
  <button class="hbtn" id="btn-reset" title="Erase everything and start again">↺ Reset</button>
</header>

<main>

  <!-- ============ LESSONS ============ -->
  <aside id="lessons">
    <div id="lesson-nav"></div>
    <div id="lesson-body"></div>
    <div class="lnav">
      <button id="lesson-prev">← Back</button>
      <button id="lesson-next">Next lesson →</button>
    </div>
  </aside>

  <!-- ============ TERMINAL ============ -->
  <section id="centre">
    <div id="terminal">
      <div class="termbar">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="ttitle">student@ros2 — bash — your pretend Linux computer</span>
      </div>

      <div id="term-scroll"><div id="term-out"></div></div>

      <div id="term-line">
        <span id="term-prompt">student@ros2:~$</span>
        <input id="term-input" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" aria-label="terminal input">
      </div>

      <div id="term-stream">
        <span class="blink">●</span>
        <span id="term-streamlabel">running</span>
        <span style="color:var(--ink3)">— press Ctrl+C to stop</span>
        <button id="term-stop">⏹ stop</button>
      </div>

      <div id="quickbar">
        <button data-cmd="__ctrlc" class="danger">Ctrl+C</button>
        <button data-cmd="help">help</button>
        <button data-cmd="hint">hint</button>
        <button data-cmd="ls">ls</button>
        <button data-cmd="pwd">pwd</button>
        <button data-cmd="tree">tree</button>
        <button data-cmd="source /opt/ros/jazzy/setup.bash">source ROS 2</button>
        <button data-cmd="ros2 node list">ros2 node list</button>
        <button data-cmd="ros2 topic list">ros2 topic list</button>
        <button data-cmd="jobs">jobs</button>
        <button data-cmd="kill all">kill all</button>
        <button data-cmd="clear">clear</button>
      </div>
    </div>

    <div id="explain">
      <div class="ehead"><span class="dot"></span> What just happened?</div>
      <div id="explain-feed"></div>
    </div>
  </section>

  <!-- ============ LIVE VIEWS ============ -->
  <section id="views">
    <div id="view-tabs">
      <button data-panel="files" class="on">📁 Files</button>
      <button data-panel="editor">📝 Editor</button>
      <button data-panel="graph">🕸️ Graph</button>
      <button data-panel="robot">🐢 Robot</button>
      <button data-panel="inspect">📊 Inspect</button>
    </div>

    <div class="panels">

      <!-- Files -->
      <div class="panel on" id="panel-files">
        <div id="file-tree"></div>
        <div class="viewfoot">
          <span>you are in</span><span class="path" id="file-cwd">/home/student</span>
        </div>
      </div>

      <!-- Editor -->
      <div class="panel" id="panel-editor">
        <div id="editor-head">
          <span id="editor-title">no file open</span>
          <button id="editor-save">Saved</button>
        </div>
        <div id="editor-wrap">
          <pre id="editor-lines"></pre>
          <textarea id="editor-area" spellcheck="false" autocomplete="off"
                    autocapitalize="off" autocorrect="off" aria-label="code editor"></textarea>
        </div>
        <div id="editor-status"></div>
      </div>

      <!-- Graph -->
      <div class="panel" id="panel-graph">
        <div class="canvaswrap"><canvas id="graph-canvas"></canvas></div>
        <div class="viewfoot">
          <label><input type="checkbox" id="graph-hidden"> show hidden ROS topics</label>
        </div>
      </div>

      <!-- Robot -->
      <div class="panel" id="panel-robot">
        <div class="canvaswrap"><canvas id="sim-canvas" width="360" height="360"></canvas></div>
        <div class="dpad">
          <button class="up" data-dir="up" title="forward">▲</button>
          <button class="left" data-dir="left" title="turn left">◀</button>
          <button class="down" data-dir="down" title="backward">▼</button>
          <button class="right" data-dir="right" title="turn right">▶</button>
        </div>
        <div id="sim-hint"></div>
      </div>

      <!-- Inspector -->
      <div class="panel" id="panel-inspect">
        <div id="inspect-body"></div>
        <div class="viewfoot">
          <label><input type="checkbox" id="auto-follow" checked> follow along automatically</label>
        </div>
      </div>

    </div>
  </section>

</main>

<div id="confetti"></div>

<script src="js/version.js"></script>
<script src="js/util.js"></script>
<script src="js/vfs.js"></script>
<script src="js/interfaces.js"></script>
<script src="js/rosgraph.js"></script>
<script src="js/programs.js"></script>
<script src="js/analyze.js"></script>
<script src="js/shell.js"></script>
<script src="js/ros2cli.js"></script>
<script src="js/workspace.js"></script>
<script src="js/terminal.js"></script>
<script src="js/sim.js"></script>
<script src="js/graph.js"></script>
<script src="js/panels.js"></script>
<script src="js/lessons.js"></script>
<script src="js/lessons2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
